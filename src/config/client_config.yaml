comm_config:
  mqtt:
    type: client
    client_name: workstation
    mqtt_broker: localhost
    mqtt_broker_port: 1884
    mqtt_sub_timeout_s: 30
    mqtt_server_topic: advert_server
    mqtt_client_topic: advert_client
    heartbeat_timeout_s: 15
  grpc:
    workers: 8
    sync_port: 50053
    async_port: 50054
dataset_config:
  datasets_dir_path: /src/data
general_config:
  temp_dir_path: temp
  cleanup_session_on_exit: False
  cleanup_model_cache_on_exit: False
  cleanup_temp_on_exit: False
  use_gpu: True
  # Debug/validation aid: when True, StartTraining skips real local training
  # entirely (no ClientTrainer, no dataset load) and returns the incoming
  # model_wts unchanged with zeroed placeholder metrics. Everything below
  # that point (secret-sharing, SubmitShare, RunAggregationRound, reveal,
  # aggregate()) still runs for real -- this isolates/speeds up iteration on
  # the aggregation path without paying real training cost. The global model
  # will not change round-over-round and accuracy will look flat while this
  # is on -- expected, not a bug. See docs/secure_aggregation/rollout_guide.md.
  local_training_disabled: False

secure_aggregation:
  enabled: False
  sharing_scheme: replicated3pc
  fixed_point:
    bitlength: 64
    frac_bits: 13
  party_endpoints:
    - {party_index: 0, host: secure_agg_party0, port: 50100}
    - {party_index: 1, host: secure_agg_party1, port: 50101}
    - {party_index: 2, host: secure_agg_party2, port: 50102}
  submission_timeout_s: 30
