comm_config:
  mqtt:
    type: client
    mqtt_broker: <mqtt_ip>
    client_name: <client_name>
    mqtt_broker_port: <mqtt_port>
    mqtt_sub_timeout_s: <mqtt_sub_timeout>
    mqtt_server_topic: advert_server
    mqtt_client_topic: advert_client
    heartbeat_timeout_s: <hearatbeat_timeout>
  grpc:
    workers: 8
    sync_port: 50053
    async_port: 50054
dataset_config:
  datasets_dir_path: <dataset_path>
general_config:
  temp_dir_path: temp
  cleanup_session_on_exit: False
  cleanup_model_cache_on_exit: False
  cleanup_temp_on_exit: False
  use_gpu: <True/False>
  # Debug/validation aid: when True, StartTraining skips real local training
  # entirely and returns the incoming model_wts unchanged with zeroed
  # placeholder metrics -- everything else (secret-sharing, aggregation)
  # still runs for real. See docs/secure_aggregation/rollout_guide.md.
  local_training_disabled: <True/False>

# See docs/secure_aggregation/design.md. When enabled==False (default), this
# client's behavior is byte-for-byte unchanged from today's plaintext path.
secure_aggregation:
  enabled: <True/False>
  sharing_scheme: replicated3pc
  # "client_side" (default): pre-weight the update by this client's own
  # dataset size before sharing. "mpc_product": share the RAW update
  # instead -- the party cluster computes weight*dataset_size itself via
  # secret x secret multiplication. Must match every party's
  # backend.hpmpc.weighting_mode -- see
  # docs/secure_aggregation/mult_fedavg.md. Currently "mpc_product" is only
  # supported when every party is configured with protocol: 5 (Trio).
  weighting_mode: client_side
  fixed_point:
    bitlength: 64
    frac_bits: 13
  party_endpoints:
    - {party_index: 0, host: <party0_host>, port: <party0_bind_port>}
    - {party_index: 1, host: <party1_host>, port: <party1_bind_port>}
    - {party_index: 2, host: <party2_host>, port: <party2_bind_port>}
  submission_timeout_s: 30
