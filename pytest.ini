[pytest]
testpaths = tests
markers =
    unit: fast, in-memory, no network/process/hpmpc dependency
    integration: real network/processes (e.g. in-process gRPC party servers), no hpmpc build required
    e2e: full docker-compose based end-to-end tests
    slow_hpmpc_build: requires compiling real hpmpc executables; opt-in, run manually or in a dedicated CI job
asyncio_mode = auto
